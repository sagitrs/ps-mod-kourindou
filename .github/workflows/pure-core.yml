# Pure core only: no game assemblies, game/client installation or real saves.
name: pure-core

on:
  push:
    branches: [main, "v1/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pure-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_GCHeapHardLimit: "0x80000000"
      DOTNET_PROCESSOR_COUNT: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - name: Check docs and CI guard self-tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 tools/docs/check_docs.py
          python3 tools/docs/test_check_docs.py
          python3 tools/ci/test_verify_pure_core.py
      - name: Verify game-independent core with bounded CPU affinity
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cpus="$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')"
          test -n "$cpus"
          taskset -c "$cpus" ./tools/ci/verify-pure-core.sh

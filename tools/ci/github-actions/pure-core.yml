# Candidate for W2 one-time wiring with a short-lived single-repo App token.
# Not enabled or executed yet. Runs only the game-independent core.
#
# Action pins resolved on 2026-11-12:
#   actions/checkout v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-dotnet v4 -> 67a3573c9a986a3f9c594539f4ab511d57bb3ce9
name: pure-core

on:
  push:
    branches: [main, "v1/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pure-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_GCHeapHardLimit: "0x80000000"
      DOTNET_PROCESSOR_COUNT: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - name: Verify game-independent core
        run: taskset -c 0,1 ./tools/ci/verify-pure-core.sh
